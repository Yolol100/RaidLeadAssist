name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua validation tooling
        shell: bash
        run: |
          set -euo pipefail
          # GitHub-hosted Ubuntu runners can temporarily prefer an unhealthy
          # Azure mirror. Keep CI deterministic and bounded by falling back to
          # Ubuntu's canonical archive and using explicit network retries/timeouts.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/apt-mirrors.txt
          fi
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y lua5.1 lua-check
      - name: Validate audit tooling and baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_release.py scripts/check_upstream_drift.py scripts/audit_runtime.py scripts/audit_repository.py
          python3 scripts/check_upstream_drift.py --validate-only
          python3 scripts/audit_runtime.py
          python3 scripts/audit_repository.py
          git diff --check
      - name: Compile Lua files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
      - name: Static Lua analysis
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_files < <(grep -vE '^[[:space:]]*(#|$)' RaidLeadAssist.toc)
          luacheck --no-color "${runtime_files[@]}"
      - name: Verify TOC files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            case "$entry" in ''|'##'*|'#'*) continue ;; esac
            test -f "$entry" || { echo "Missing TOC file: $entry" >&2; exit 1; }
          done < RaidLeadAssist.toc
      - name: Run focused behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/test_*.lua; do
            if ! output="$(lua5.1 "$file" 2>&1)"; then
              printf '%s\n' "$output"
              message="$(printf '%s' "$output" | tr '\r\n' '  ' | sed 's/%/%25/g')"
              echo "::error file=$file::$message"
              exit 1
            fi
            printf '%s\n' "$output"
          done
      - name: Build primary release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --output dist/RaidLeadAssist.zip
          sha256sum dist/RaidLeadAssist.zip > dist/RaidLeadAssist.zip.sha256
      - name: Upload primary release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RaidLeadAssist-primary-${{ github.sha }}
          path: |
            dist/RaidLeadAssist.zip
            dist/RaidLeadAssist.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build independent release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --output dist/RaidLeadAssist.zip
          sha256sum dist/RaidLeadAssist.zip > dist/RaidLeadAssist.zip.sha256
      - name: Upload independent release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RaidLeadAssist-repro-${{ github.sha }}
          path: |
            dist/RaidLeadAssist.zip
            dist/RaidLeadAssist.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  reproducibility-check:
    needs: [validation, reproducibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download primary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RaidLeadAssist-primary-${{ github.sha }}
          path: primary
      - name: Download independent artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RaidLeadAssist-repro-${{ github.sha }}
          path: repro
      - name: Compare release bytes and hashes
        shell: bash
        run: |
          set -euo pipefail
          cmp primary/RaidLeadAssist.zip repro/RaidLeadAssist.zip
          cmp primary/RaidLeadAssist.zip.sha256 repro/RaidLeadAssist.zip.sha256

  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reproducibility-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RaidLeadAssist-primary-${{ github.sha }}
          path: dist
      - name: Attest verified release ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/RaidLeadAssist.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [reproducibility-check, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RaidLeadAssist-primary-${{ github.sha }}
          path: dist
      - name: Verify release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify dist/RaidLeadAssist.zip --repo "$GITHUB_REPOSITORY"
      - name: Create or verify version-locked prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^## Version:[[:space:]]*//p' RaidLeadAssist.toc | head -n1)"
          test -n "$version"
          notes="$(mktemp)"
          awk -v prefix="## ${version} " '
            index($0, prefix) == 1 { active=1; next }
            active && /^## / { exit }
            active { print }
          ' CHANGELOG.md > "$notes"
          test -s "$notes"
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$version" --jq .sha)"
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "Release $version already points to $existing_sha, not $GITHUB_SHA. Bump the version before another main release." >&2
              exit 1
            fi
          else
            gh release create "$version" dist/RaidLeadAssist.zip dist/RaidLeadAssist.zip.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$version" --notes-file "$notes" --prerelease
          fi
