name: Validate source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 lua-check
      - name: Validate audit tooling and baselines
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/build_release.py scripts/check_upstream_drift.py scripts/audit_runtime.py
          python3 scripts/check_upstream_drift.py --validate-only
          python3 scripts/audit_runtime.py
      - name: Compile Lua files
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            LUA_FILE="$file" lua5.1 -e 'local f,e=loadfile(os.getenv("LUA_FILE")); assert(f,e)'
          done
      - name: Static Lua analysis
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t runtime_files < <(grep -vE '^[[:space:]]*(#|$)' RaidLeadAssist.toc)
          luacheck --no-color "${runtime_files[@]}"
      - name: Verify TOC files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r entry; do
            case "$entry" in ''|'##'*|'#'*) continue ;; esac
            test -f "$entry" || { echo "Missing TOC file: $entry" >&2; exit 1; }
          done < RaidLeadAssist.toc
      - name: Run focused behavioral regressions
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/test_*.lua; do
            if ! output="$(lua5.1 "$file" 2>&1)"; then
              printf '%s\n' "$output"
              message="$(printf '%s' "$output" | tr '\r\n' '  ' | sed 's/%/%25/g')"
              echo "::error file=$file::$message"
              exit 1
            fi
            printf '%s\n' "$output"
          done
      - name: Build and verify reproducible release ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --output dist/RaidLeadAssist.zip
          python3 scripts/build_release.py --output dist/RaidLeadAssist.repeat.zip
          cmp dist/RaidLeadAssist.zip dist/RaidLeadAssist.repeat.zip
          rm dist/RaidLeadAssist.repeat.zip
          sha256sum dist/RaidLeadAssist.zip > dist/RaidLeadAssist.zip.sha256
      - name: Upload verified release artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RaidLeadAssist-${{ github.sha }}
          path: |
            dist/RaidLeadAssist.zip
            dist/RaidLeadAssist.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  provenance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RaidLeadAssist-${{ github.sha }}
          path: dist
      - name: Attest verified release ZIP
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/RaidLeadAssist.zip
