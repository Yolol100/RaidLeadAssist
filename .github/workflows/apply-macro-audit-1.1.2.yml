name: Apply macro audit 1.1.2

on:
  push:
    branches:
      - fix/macro-audit-icons-sszorak-ui-20260916

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/macro-audit-icons-sszorak-ui-20260916
          fetch-depth: 0
      - name: Apply audited encounter and UI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_macro_audit_112.py
          git checkout -- .github/workflows/validation.yml
          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          if git diff --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Encounters/VenomousAbyss Services/BossMacroService.lua UI/BossMacroManager.lua RaidLeadAssist.toc
          git commit -m 'Audit boss macros, icons, Sszorak soak plan, and UI'
          git push origin HEAD:fix/macro-audit-icons-sszorak-ui-20260916
