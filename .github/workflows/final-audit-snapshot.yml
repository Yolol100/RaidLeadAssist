name: Apply final audit patch

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply reviewed non-workflow audit changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f final-audit-nonworkflow.patch.gz.b64 ]; then
            echo "No staged audit patch; nothing to apply."
            exit 0
          fi
          base64 -d final-audit-nonworkflow.patch.gz.b64 | gunzip > /tmp/final-audit.patch
          git apply --check /tmp/final-audit.patch
          git apply /tmp/final-audit.patch
          rm final-audit-nonworkflow.patch.gz.b64
          git diff --check
          git config user.name "RaidLeadAssist Final Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          python3 scripts/check_upstream_drift.py --validate-only
          python3 scripts/audit_runtime.py
          python3 scripts/audit_repository.py
          python3 tests/test_upstream_drift.py
          git diff --cached --check
          git commit -m "fix: close final repository audit gaps"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:audit/final-plafond-20260914
