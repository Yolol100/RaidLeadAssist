name: temporary-audit-v2

on:
  push:
    branches:
      - feature/blizzard-boss-macro-manager
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Syntax, manifest and architecture audit
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done < <(find . -name '*.lua' -print0)

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          toc = []
          for raw in (root / 'RaidLeadAssist.toc').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line and not line.startswith('#'):
                  toc.append(line)

          assert toc, 'TOC contains no runtime files'
          missing = [p for p in toc if not (root / p).is_file()]
          assert not missing, f'TOC references missing files: {missing}'

          listed_lua = {p for p in toc if p.endswith('.lua')}
          repo_lua = {
              p.relative_to(root).as_posix()
              for p in root.rglob('*.lua')
              if '.git/' not in p.as_posix()
          }
          assert listed_lua == repo_lua, (
              f'Runtime closure mismatch. Unlisted={sorted(repo_lua-listed_lua)} '
              f'Missing={sorted(listed_lua-repo_lua)}'
          )

          legacy = (
              'AssignmentRegistry', 'SetupRegistry', 'AssignmentService',
              'AssignmentFrame', 'SettingsFrame', 'MainFrame', 'ProductivityPanel',
              'SentinelsPanel', 'TimingGuidanceService', 'RaidWarningService',
              'RosterService', 'SetupService',
          )
          stale_toc = [p for p in toc if any(name in p for name in legacy)]
          assert not stale_toc, f'Legacy paths remain in TOC: {stale_toc}'

          registrations = {}
          gets = []
          runtime_text = []
          for index, rel in enumerate(toc):
              if not rel.endswith('.lua'):
                  continue
              text = (root / rel).read_text(encoding='utf-8')
              runtime_text.append((rel, text))
              for name in re.findall(r'ns:RegisterModule\("([^"]+)"', text):
                  assert name not in registrations, f'Duplicate module registration: {name}'
                  registrations[name] = (rel, index)
              for name in re.findall(r'ns:GetModule\("([^"]+)"', text):
                  gets.append((rel, index, name))

          unresolved = [(rel, name) for rel, _, name in gets if name not in registrations]
          assert not unresolved, f'Unresolved module dependencies: {unresolved}'

          late = []
          for rel, index, name in gets:
              provider, provider_index = registrations[name]
              if provider_index >= index:
                  late.append((rel, name, provider))
          assert not late, f'Modules loaded after their consumers: {late}'

          stale_refs = []
          for rel, text in runtime_text:
              for name in legacy:
                  if f'GetModule("{name}' in text or f'GetModule("Services.{name}' in text or f'GetModule("UI.{name}' in text:
                      stale_refs.append((rel, name))
          assert not stale_refs, f'Legacy module references remain: {stale_refs}'

          toc_text = (root / 'RaidLeadAssist.toc').read_text(encoding='utf-8')
          assert '## Version: 1.0.0-beta.1' in toc_text
          assert 'Services/ManagedMacroService.lua' in toc_text
          assert 'Services/ActionBarOverlayService.lua' in toc_text
          assert 'UI/BossMacroManager.lua' in toc_text
          assert 'UI/IconPicker.lua' in toc_text

          icon_picker = (root / 'UI/IconPicker.lua').read_text(encoding='utf-8')
          assert 'Macro name cannot be empty.' in icon_picker
          assert 'cancelCallback' in icon_picker and 'accepted' in icon_picker

          manager = (root / 'UI/BossMacroManager.lua').read_text(encoding='utf-8')
          assert 'getMacroMaxLength' in manager
          assert 'total > maxLength' in manager
          assert 'BossMacros:DeleteMacro(boss.id, macro.id)' in manager

          managed = (root / 'Services/ManagedMacroService.lua').read_text(encoding='utf-8')
          for required in ('InCombatLockdown', 'PLAYER_REGEN_ENABLED', 'CreateMacro', 'EditMacro', 'DeleteMacro', 'PickupMacro'):
              assert required in managed, f'Managed macro safety marker missing: {required}'

          overlay = (root / 'Services/ActionBarOverlayService.lua').read_text(encoding='utf-8')
          assert 'Util.IsSecret(action)' in overlay
          assert 'Util.IsSecret(actionType)' in overlay
          assert 'Util.IsSecret(actionId)' in overlay

          print(f'ARCHITECTURE PASS: {len(toc)} runtime files, {len(registrations)} modules')
          PY

      - name: Controlled runtime regression matrix
        run: |
          cat > /tmp/rla_audit.lua <<'LUA'
          local failures, scenarios = 0, 0
          local function check(name, condition, detail)
              scenarios = scenarios + 1
              if condition then
                  print('PASS ' .. name)
              else
                  failures = failures + 1
                  print('FAIL ' .. name .. (detail and (' :: ' .. tostring(detail)) or ''))
              end
          end

          _G.issecretvalue = function() return false end
          _G.GetTime = function() return _G.__now or 100 end
          _G.IsInRaid = function() return false end
          _G.UnitIsGroupLeader = function() return false end
          _G.UnitIsGroupAssistant = function() return false end
          _G.C_Spell = { GetSpellTexture = function(id) return id and (id + 1000000) or nil end }
          _G.GetSpellTexture = function(id) return id and (id + 1000000) or nil end

          local printed = {}
          local ns = { modules = {} }
          function ns:RegisterModule(name, module)
              assert(type(name) == 'string' and type(module) == 'table')
              assert(not self.modules[name], 'duplicate module ' .. name)
              self.modules[name] = module
          end
          function ns:GetModule(name)
              assert(self.modules[name], 'missing module ' .. tostring(name))
              return self.modules[name]
          end
          function ns:Print(message) printed[#printed + 1] = tostring(message) end
          local function load_module(path)
              local chunk, err = loadfile(path)
              assert(chunk, err)
              return chunk('RaidLeadAssist', ns)
          end

          load_module('Core/Constants.lua')
          load_module('Core/Util.lua')
          local RLAConstants = ns:GetModule('Core.Constants')

          -- Boundary and generated timing scenarios.
          local cases = {
              {60, true, 'WAIT'}, {6, true, 'WAIT'}, {5, true, 'PREPARE'},
              {4, true, 'PREPARE'}, {3, true, 'PRESS'}, {2, true, 'PRESS'},
              {0, true, 'PRESS'}, {-0.1, true, 'LATE'}, {-1, true, 'LATE'},
              {-1.01, true, 'IDLE'}, {2, false, 'IDLE'}, {2, nil, 'IDLE'},
          }
          for index, item in ipairs(cases) do
              check('timing-boundary-' .. index,
                  RLAConstants.GetGuidanceState({}, item[1], item[2]) == item[3],
                  tostring(item[1]))
          end
          for remaining = 1, 60 do
              local expected = remaining <= 3 and 'PRESS' or (remaining <= 5 and 'PREPARE' or 'WAIT')
              check('timing-generated-' .. remaining,
                  RLAConstants.GetGuidanceState({}, remaining, true) == expected,
                  tostring(remaining))
          end
          local p, q = RLAConstants.GetCallTiming({prepareSeconds=2, pressSeconds=9}, {prepare=6, press=2})
          check('invalid-inverted-timing-falls-back', p == 6 and q == 2, tostring(p)..'/'..tostring(q))
          p, q = RLAConstants.GetCallTiming({prepareSeconds=31, pressSeconds=2}, {prepare=7, press=3})
          check('out-of-range-timing-falls-back', p == 7 and q == 3, tostring(p)..'/'..tostring(q))

          -- Database migration, corrupt input and ID-reconciliation scenarios.
          _G.RaidLeadAssistDB = {
              schemaVersion = 7,
              selectedBossKey = 'nekzali',
              selectedDifficultyKey = 'normal',
              timingLead = {prepare=1, press=9},
              uiScale = 99,
              position = {point='BAD', relativePoint='CENTER', x=0, y=0},
              nextBossId = -2,
              nextMacroId = 'bad',
          }
          load_module('Core/Database.lua')
          local Database = ns:GetModule('Core.Database')
          Database:Initialize()
          local migrated = Database:Get()
          check('db-schema-migrated', migrated.schemaVersion == 8)
          check('db-selected-boss-id-migrated', migrated.selectedBossId == 'encounter:nekzali', migrated.selectedBossId)
          check('db-invalid-difficulty-reset', migrated.selectedDifficultyKey == 'heroic')
          check('db-invalid-timing-reset', migrated.timingLead.prepare == 5 and migrated.timingLead.press == 3)
          check('db-scale-clamped', migrated.uiScale == 1.10, migrated.uiScale)
          check('db-position-reset', migrated.position.point == 'CENTER' and migrated.position.y == 40)
          check('db-serials-normalized', migrated.nextBossId == 1 and migrated.nextMacroId == 1)

          _G.RaidLeadAssistDB = {
              schemaVersion=8, selectedBossKey='nekzali', selectedDifficultyKey='heroic',
              nextBossId=1, nextMacroId=1,
              bossProfiles={
                  ['custom:5']={id='custom:5', name='Stored', order=1, macros={{id=40, name='Stored Macro', body='/rw x'}}},
              },
          }
          Database:Initialize()
          local reconciled = Database:Get()
          check('db-boss-counter-reconciled', reconciled.nextBossId == 6, reconciled.nextBossId)
          check('db-macro-counter-reconciled', reconciled.nextMacroId == 41, reconciled.nextMacroId)

          _G.RaidLeadAssistDB = {schemaVersion=99, selectedBossKey='nekzali'}
          Database:Initialize()
          check('newer-schema-detected', Database:HasNewerSchema())
          check('newer-schema-marker-preserved', Database:Get().schemaVersion == 99, Database:Get().schemaVersion)

          -- Real BossMacroService with a minimal registry double.
          local heroicA = {key='a', ability='Ability A', warning='Warn A', spellIDs={101}, iconSpellID=999, prepareSeconds=7, pressSeconds=4}
          local heroicB = {key='b', ability='Ability B', warning='Warn B', timerNames={'|cffffffffTimer B|r (2)'}, timing=false, iconSpellID=202}
          local mythicA = {key='a', ability='Ability A Mythic', warning='Warn A Mythic', spellIDs={101}, prepareSeconds=8, pressSeconds=5}
          local mythicC = {key='c', ability='Ability C', warning='Warn C', spellIDs={303}, prepareSeconds=6, pressSeconds=2}
          local function profile(calls)
              local by = {}
              for _, c in ipairs(calls) do by[c.key] = c end
              return {calls=calls, callsByKey=by}
          end
          local profiles = {heroic=profile({heroicA, heroicB}), mythic=profile({mythicA, mythicC})}
          local Registry = {}
          function Registry:GetOrdered() return {{key='boss', name='Boss One', encounterID=123}} end
          function Registry:GetProfile(key, difficulty) if key == 'boss' then return profiles[difficulty] end end
          ns:RegisterModule('Encounters.Registry', Registry)

          load_module('Services/BossMacroService.lua')
          local BossMacros = ns:GetModule('Services.BossMacroService')
          local db = {
              bossProfiles={}, deletedDefaultBosses={}, pendingMacroSync={},
              nextBossId=1, nextMacroId=1, selectedBossKey='boss', selectedDifficultyKey='heroic',
              customMessages={}, timingLead={prepare=5, press=3},
          }
          BossMacros:Initialize(db)
          local boss = BossMacros:GetBoss('encounter:boss')
          local macros = BossMacros:GetMacros(boss.id)
          check('default-boss-seeded', boss and boss.encounterID == 123)
          check('difficulty-call-keys-deduplicated', #macros == 3, #macros)
          local byKey = {}
          for _, macro in ipairs(macros) do byKey[macro.sourceCallKey] = macro end
          check('explicit-ability-icon-retained', byKey.a.iconSpellID == 999, byKey.a.iconSpellID)
          check('timing-disabled-call-retained', byKey.b.timingEnabled == false)
          check('ability-icon-resolves', BossMacros:GetIcon(byKey.a) == 1000999, BossMacros:GetIcon(byKey.a))

          local created = assert(BossMacros:CreateMacro(boss.id))
          local ok, updated = BossMacros:UpdateMacro(boss.id, created.id, {
              name='Longer Than Sixteen Character Name', body='/rw hello',
              iconMode='custom', customIcon='134400', timingEnabled=true,
              prepareSeconds=2, pressSeconds=9, spellID='303', timerName='Timer C'
          })
          check('macro-update-succeeds', ok == true)
          check('macro-name-truncated', #updated.name <= 16, updated.name)
          check('macro-icon-normalized', updated.customIcon == 134400, updated.customIcon)
          check('macro-invalid-timing-normalized', updated.prepareSeconds == 5 and updated.pressSeconds == 3, tostring(updated.prepareSeconds)..'/'..tostring(updated.pressSeconds))
          check('macro-spell-id-normalized', updated.spellIDs[1] == 303)
          check('macro-timer-alias-normalized', updated.timerNames[1] == 'Timer C')

          local customBoss = assert(BossMacros:CreateBoss('Custom Boss'))
          check('custom-boss-created', customBoss.id == 'custom:1', customBoss.id)
          local customMacro = assert(BossMacros:CreateMacro(customBoss.id))
          check('custom-macro-id-unique', customMacro.id > updated.id, customMacro.id)
          check('empty-name-rejected-by-service', BossMacros:UpdateMacro(customBoss.id, customMacro.id, {name='   ', body='/rw x'}) == false)
          check('empty-body-rejected-by-service', BossMacros:UpdateMacro(customBoss.id, customMacro.id, {name='x', body=''}) == false)

          local timeline = {timers={}}
          function timeline:IsActionable(timer) return timer.precision == 'exact' and timer.faded ~= true end
          function timeline:GetActionableTimerForCall() return nil end
          function timeline:AcknowledgeCall() return false end
          timeline.timers.x = {key=303, name='Timer C', precision='exact', faded=false, expiration=102, duration=10, startedAt=92}
          timeline.timers.y = {key=303, name='Timer C', precision='approximate', faded=false, expiration=101, duration=10, startedAt=91}
          _G.__now = 100
          local timing = BossMacros:GetTimingState(boss, updated, timeline)
          check('raw-spell-fallback-timer-match', timing and timing.timer == timeline.timers.x and timing.remaining == 2, timing and timing.remaining)
          check('approximate-timer-not-selected', timing and timing.timer ~= timeline.timers.y)
          check('custom-timing-press-state', timing and timing.state == RLAConstants.CallState.PRESS, timing and timing.state)
          check('ack-fallback-marks-raw-timer', BossMacros:AcknowledgeMacro(updated.id, timeline) == true and timeline.timers.x.acknowledged == true)

          -- Real ManagedMacroService with minimal WoW macro API doubles.
          local charMacros, picked, combat = {}, nil, false
          _G.Constants = {MacroConsts={MAX_ACCOUNT_MACROS=120, MAX_CHARACTER_MACROS=18, MAX_MACRO_LENGTH=255}}
          _G.GetNumMacros = function() return 0, #charMacros end
          _G.GetMacroInfo = function(index)
              local item = charMacros[index - 120]
              if not item then return nil end
              return item.name, item.icon, item.body
          end
          _G.CreateMacro = function(name, icon, body, perCharacter)
              assert(perCharacter == true)
              charMacros[#charMacros+1] = {name=name, icon=icon, body=body}
              return 120 + #charMacros
          end
          _G.EditMacro = function(index, name, icon, body)
              local item = assert(charMacros[index - 120])
              item.name, item.icon, item.body = name or item.name, icon or item.icon, body or item.body
              return index
          end
          _G.DeleteMacro = function(index) table.remove(charMacros, index - 120) end
          _G.PickupMacro = function(index) picked = index end
          _G.InCombatLockdown = function() return combat end
          _G.C_Timer = {After=function(_, callback) callback() end}
          _G.CreateFrame = function()
              return {RegisterEvent=function() end, SetScript=function(self, kind, fn) self[kind]=fn end}
          end

          load_module('Services/ManagedMacroService.lua')
          local Managed = ns:GetModule('Services.ManagedMacroService')
          local managedDb = {pendingMacroSync={}}
          local ackId = nil
          Managed:Initialize(managedDb, function(id) ackId=id end)

          local mm = {id=777, name='12345678901234567890', body='/rw managed', iconMode='custom', customIcon=134400, spellIDs={}}
          boss.macros[#boss.macros+1] = mm
          local valid, managedBody = Managed:ValidateMacro(mm)
          check('managed-body-valid', valid == true)
          check('managed-marker-appended', managedBody:match('/run RLA_P%(777%)') ~= nil, managedBody)
          check('managed-overhead-counted', #managedBody == #mm.body + Managed:GetManagedOverhead(mm.id), #managedBody)
          check('managed-max-exposed', Managed:GetMacroBodyMax() == 255, Managed:GetMacroBodyMax())
          local tooLong = {id=778, name='x', body=string.rep('x', 255), iconMode='custom', customIcon=134400, spellIDs={}}
          check('managed-over-limit-rejected', Managed:ValidateMacro(tooLong) == false)

          local synced, idx = Managed:SyncMacro(mm, true)
          check('managed-create-character-macro', synced and idx == 121 and #charMacros == 1, tostring(idx)..'/'..#charMacros)
          check('managed-name-truncated-16', #charMacros[1].name == 16, charMacros[1].name)
          mm.body='/rw edited'
          local synced2, idx2 = Managed:SyncMacro(mm, true)
          check('managed-edit-no-duplicate', synced2 and idx2 == 121 and #charMacros == 1 and charMacros[1].body:find('/rw edited',1,true) == 1)
          check('managed-id-roundtrip', Managed:GetManagedIdByMacroIndex(121) == 777)
          check('managed-pickup', Managed:Pickup(mm) == true and picked == 121, picked)
          _G.RLA_P(777)
          check('managed-click-ack-callback', ackId == 777, ackId)

          combat = true
          mm.body='/rw queued'
          local qok, qreason = Managed:SyncMacro(mm, true)
          check('combat-sync-deferred', qok == false and qreason == 'combat' and managedDb.pendingMacroSync['777'] == 'sync')
          check('combat-sync-no-write', charMacros[1].body:find('/rw edited',1,true) == 1)
          combat = false
          Managed:FlushQueue()
          check('post-combat-sync-flushed', managedDb.pendingMacroSync['777'] == nil and charMacros[1].body:find('/rw queued',1,true) == 1)

          combat = true
          local dok, dreason = Managed:DeleteManaged(mm, true)
          check('combat-delete-deferred', dok == false and dreason == 'combat' and managedDb.pendingMacroSync['777'] == 'delete')
          check('combat-delete-no-write', #charMacros == 1)
          combat = false
          Managed:FlushQueue()
          check('post-combat-delete-flushed', #charMacros == 0 and managedDb.pendingMacroSync['777'] == nil)

          local pm = {id=779, name='pickup', body='/rw x', iconMode='custom', customIcon=134400, spellIDs={}}
          combat, picked = true, nil
          local pok, preason = Managed:Pickup(pm)
          check('combat-pickup-blocked', pok == false and preason == 'combat' and picked == nil)
          combat = false

          -- Real overlay presentation methods with visual-only doubles.
          ns:RegisterModule('Services.TimelineService', {})
          load_module('Services/ActionBarOverlayService.lua')
          local Overlay = ns:GetModule('Services.ActionBarOverlayService')
          local function texture()
              return {
                  color=nil, shown=false,
                  SetColorTexture=function(self,r,g,b,a) self.color={r,g,b,a} end,
                  SetWidth=function(self,v) self.width=v end,
                  SetHeight=function(self,v) self.height=v end,
                  ClearAllPoints=function() end, SetPoint=function() end,
                  Show=function(self) self.shown=true end, Hide=function(self) self.shown=false end,
              }
          end
          local function dummy_overlay()
              local o = {shown=false, button={GetWidth=function() return 40 end, GetHeight=function() return 40 end}}
              o.Progress={
                  SetMinMaxValues=function(self,a,b) self.min,self.max=a,b end,
                  SetValue=function(self,v) self.value=v end,
                  SetStatusBarColor=function(self,r,g,b,a) self.color={r,g,b,a} end,
              }
              o.Edge=texture(); o.Veil=texture()
              o.BorderTop=texture(); o.BorderBottom=texture(); o.BorderLeft=texture(); o.BorderRight=texture()
              o.Countdown={text=nil,color=nil,SetText=function(self,v) self.text=v end,SetTextColor=function(self,...) self.color={...} end}
              function o:Show() self.shown=true end
              function o:Hide() self.shown=false end
              function o:GetWidth() return 40 end
              function o:GetHeight() return 40 end
              return o
          end
          local o1=dummy_overlay(); Overlay:ApplyState(o1,{state=RLAConstants.CallState.WAIT,remaining=20,duration=40})
          check('overlay-wait-white', o1.shown and o1.Progress.value == 20 and o1.Countdown.text == '20')
          check('overlay-progress-ratio', o1.Edge.shown and o1.Edge.height == 38)
          local o2=dummy_overlay(); Overlay:ApplyState(o2,{state=RLAConstants.CallState.PREPARE,remaining=4,duration=40})
          check('overlay-prepare-amber', o2.BorderTop.color and o2.BorderTop.color[1] == 1 and o2.BorderTop.color[2] == 0.72)
          local o3=dummy_overlay(); Overlay:ApplyState(o3,{state=RLAConstants.CallState.PRESS,remaining=2,duration=40})
          check('overlay-press-red', o3.Veil.color and o3.Veil.color[1] == 0.95 and o3.Veil.color[4] > 0)
          local o4=dummy_overlay(); Overlay:ApplyState(o4,{state=RLAConstants.CallState.LATE,remaining=-0.2,duration=40})
          check('overlay-late-now', o4.Countdown.text == 'NOW' and o4.BorderTop.color[2] == 0.02)
          local o5=dummy_overlay(); Overlay:ApplyProgress(o5,{remaining=99,duration=10})
          check('overlay-progress-clamps-high', o5.Progress.value == 10, o5.Progress.value)
          local o6=dummy_overlay(); Overlay:ApplyProgress(o6,{remaining=-2,duration=10})
          check('overlay-progress-clamps-low', o6.Progress.value == 0, o6.Progress.value)

          print(('SCENARIOS %d FAILURES %d'):format(scenarios, failures))
          if failures > 0 then os.exit(1) end
          LUA
          lua5.4 /tmp/rla_audit.lua
