name: Apply UI layout and timing 1.1.6

on:
  push:
    branches:
      - fix/ui-layout-timing-1.1.6
    paths:
      - .github/workflows/apply-ui-layout-timing-1.1.6.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-layout-timing-1.1.6
      - name: Correct Boss Ability row vertical spacing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('UI/BossMacroManager.lua')
          s = p.read_text(encoding='utf-8')
          old = '    abilityLabel:SetPoint("TOPLEFT", abilityRow, "TOPLEFT", 8, -10)\n'
          new = '    abilityLabel:SetPoint("LEFT", abilityRow, "LEFT", 8, -10)\n'
          if old not in s: raise SystemExit('ability label anchor not found')
          s = s.replace(old, new, 1)
          old = '    abilityDropdown:SetPoint("LEFT", abilityRow, "LEFT", 72, 11)\n'
          new = '    abilityDropdown:SetPoint("LEFT", abilityRow, "LEFT", 72, -10)\n'
          if old not in s: raise SystemExit('ability dropdown anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          grep -q 'abilityDropdown:SetPoint("LEFT", abilityRow, "LEFT", 72, -10)' UI/BossMacroManager.lua
      - name: Commit spacing correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Andrew Baeten"
          git config user.email "Andrew_Baeten@hotmail.com"
          git add UI/BossMacroManager.lua
          git commit -m "Fix Boss Ability vertical spacing" || exit 0
          git push origin HEAD:fix/ui-layout-timing-1.1.6
