name: Apply DBM native fallback 1.1.3

on:
  push:
    branches:
      - fix/dbm-native-fallback-1.1.3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dbm-native-fallback-1.1.3
          fetch-depth: 0
      - name: Apply DBM/native timer fallback fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_dbm_native_fallback_113.py
          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          if git diff --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Services/TimelineService.lua RaidLeadAssist.toc .github/workflows/validation.yml
          git commit -m 'Fix DBM-only native timer fallback'
          git push origin HEAD:fix/dbm-native-fallback-1.1.3
