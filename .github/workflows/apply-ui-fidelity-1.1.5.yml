name: Apply UI fidelity 1.1.5

on:
  push:
    branches:
      - fix/ui-fidelity-1.1.5
    paths:
      - .github/workflows/apply-ui-fidelity-1.1.5.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-fidelity-1.1.5
      - name: Apply UI fidelity fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Could not find block: {label}")
              return text.replace(old, new, 1)

          p = Path('UI/BossMacroManager.lua')
          s = p.read_text(encoding='utf-8')

          s = replace_once(s, '''local function shortName(name)\n    name = tostring(name or "")\n    if #name <= 7 then return name end\n    return name:sub(1, 6) .. "…"\nend\n\n''', '', 'remove manual shortName')

          s = replace_once(s, '''local function setFrameTitle(frame, text)\n    if not frame then return end\n    if type(frame.SetTitle) == "function" then\n        frame:SetTitle(text)\n    elseif frame.TitleText then\n        frame.TitleText:SetText(text)\n    end\nend\n''', '''local function setFrameTitle(frame, text)\n    if not frame then return end\n    local titleText = frame.TitleContainer and frame.TitleContainer.TitleText or frame.TitleText\n    if titleText then\n        titleText:SetText(text or "")\n    elseif type(frame.SetTitle) == "function" then\n        frame:SetTitle(text or "")\n    end\nend\n''', 'native title text')

          s = replace_once(s, 'button.Name:SetText(macro and shortName(macro.name) or "")', 'button.Name:SetText(macro and tostring(macro.name or "") or "")', 'full macro name')

          for title in ('Advanced Timer Matching', 'Boss Tactics', 'Raid Lead Assist — Boss Macros'):
              s = replace_once(s, f'    setFrameTitle(frame, "{title}")\n    removePortrait(frame)\n', f'    removePortrait(frame)\n    setFrameTitle(frame, "{title}")\n', f'title order {title}')

          s = replace_once(s, '''        button:SetSize(40, 40)\n        local col = (index - 1) % columns\n        local row = math.floor((index - 1) / columns)\n        button:SetPoint("TOPLEFT", 18 + (col * 64), -8 - (row * 54))\n''', '''        button:SetSize(44, 44)\n        local col = (index - 1) % columns\n        local row = math.floor((index - 1) / columns)\n        button:SetPoint("TOPLEFT", 20 + (col * 62), -10 - (row * 50))\n''', 'macro button geometry')

          s = replace_once(s, '        selected:SetSize(50, 50)', '        selected:SetSize(56, 56)', 'selection border')

          s = replace_once(s, '''        local name = button:CreateFontString(nil, "OVERLAY", "GameFontHighlightSmallOutline")\n        name:SetPoint("TOP", button, "BOTTOM", 0, -1)\n        name:SetWidth(54)\n        name:SetWordWrap(false)\n        name:SetJustifyH("CENTER")\n        button.Name = name\n''', '''        -- Match Blizzard's MacroButtonTemplate: the macro name is a small\n        -- single-line overlay inside the icon instead of a separate label below it.\n        local name = button:CreateFontString(nil, "OVERLAY", "GameFontHighlightSmallOutline")\n        name:SetSize(36, 10)\n        name:SetPoint("BOTTOM", button, "BOTTOM", 0, 2)\n        name:SetWordWrap(false)\n        name:SetJustifyH("CENTER")\n        button.Name = name\n''', 'Blizzard macro label geometry')

          p.write_text(s, encoding='utf-8')

          p = Path('UI/IconPicker.lua')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '''    if type(frame.SetTitle) == "function" then\n        frame:SetTitle("Change Name/Icon")\n    elseif frame.TitleText then\n        frame.TitleText:SetText("Change Name/Icon")\n    end\n''', '''    local titleText = frame.TitleContainer and frame.TitleContainer.TitleText or frame.TitleText\n    if titleText then\n        titleText:SetText("Change Name/Icon")\n    elseif type(frame.SetTitle) == "function" then\n        frame:SetTitle("Change Name/Icon")\n    end\n''', 'icon picker title')
          p.write_text(s, encoding='utf-8')

          p = Path('RaidLeadAssist.toc')
          s = p.read_text(encoding='utf-8')
          s = s.replace('## Version: 1.1.4', '## Version: 1.1.5', 1)
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          grep -q '^## Version: 1.1.5$' RaidLeadAssist.toc
          grep -q 'name:SetSize(36, 10)' UI/BossMacroManager.lua
          grep -q 'frame.TitleContainer and frame.TitleContainer.TitleText' UI/BossMacroManager.lua

      - name: Commit UI fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Andrew Baeten"
          git config user.email "Andrew_Baeten@hotmail.com"
          git add UI/BossMacroManager.lua UI/IconPicker.lua RaidLeadAssist.toc
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "RaidLeadAssist 1.1.5: match Blizzard macro UI layout"
          git push origin HEAD:fix/ui-fidelity-1.1.5
