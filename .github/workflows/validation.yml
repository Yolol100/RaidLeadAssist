name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    name: validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository hygiene and manifest
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .rla-payload
          test ! -e .github/workflows/rla-apply.yml
          test ! -e .github/workflows/apply-ui-polish-1.1.1.yml
          test ! -e .github/workflows/apply-macro-audit-1.1.2.yml
          test ! -e .github/scripts/apply_macro_audit_112.py
          test ! -e .github/workflows/apply-dbm-native-fallback-1.1.3.yml
          test ! -e .github/scripts/apply_dbm_native_fallback_113.py
          test ! -e .github/workflows/apply-ui-layout-1.1.4.yml
          test ! -e .github/scripts/apply_ui_layout_114.py
          test ! -e .github/workflows/apply-ui-fidelity-1.1.5.yml
          test ! -e .github/workflows/apply-ui-layout-timing-1.1.6.yml
          grep -q '^## Interface: 120100$' RaidLeadAssist.toc
          grep -q '^## Version: 1.1.10$' RaidLeadAssist.toc
          grep -q '^Services/TestModeService.lua$' RaidLeadAssist.toc
          grep -q '^Services/MigrationPolishService.lua$' RaidLeadAssist.toc
          grep -q '^Services/TacticsMacroService.lua$' RaidLeadAssist.toc
          grep -q '^UI/RaidLeaderPolish.lua$' RaidLeadAssist.toc
          grep -q '^UI/LayoutHotfix.lua$' RaidLeadAssist.toc
          grep -q 'Boss Tactics' UI/BossMacroManager.lua
          grep -q 'selectedDifficultyKey' Services/BossMacroService.lua
          grep -q 'ButtonFrameTemplate_HidePortrait' UI/BossMacroManager.lua
          grep -q 'ButtonFrameTemplate_HidePortrait' UI/IconPicker.lua
          grep -q 'frame.TitleContainer:SetPoint("TOPLEFT"' UI/BossMacroManager.lua
          grep -q 'frame.TitleContainer and frame.TitleContainer.TitleText' UI/BossMacroManager.lua
          grep -q 'contentAnchor = frame.Inset or frame' UI/BossMacroManager.lua
          grep -q 'name:SetSize(36, 10)' UI/BossMacroManager.lua
          grep -q 'name:SetPoint("BOTTOM", button, "BOTTOM", 0, 2)' UI/BossMacroManager.lua
          grep -q 'bossRow:SetPoint("TOPLEFT", frame, "TOPLEFT", 15, -45)' UI/BossMacroManager.lua
          grep -q 'difficultyRow:SetPoint("TOPLEFT", frame, "TOPLEFT", 15, -78)' UI/BossMacroManager.lua
          grep -q 'moveLeft:SetPoint("TOPLEFT", grid, "BOTTOMLEFT", 8, -2)' UI/BossMacroManager.lua
          ! grep -q 'Drag icons to reorder' UI/BossMacroManager.lua
          ! grep -q 'addHorizontalBar(frame' UI/BossMacroManager.lua
          grep -q 'legacyTacticsText' Services/BossMacroService.lua
          grep -q 'legacyWarnings' Services/BossMacroService.lua
          grep -q 'spellIDs = { 1287426 }' Encounters/VenomousAbyss/Nekzali.lua
          grep -q 'iconSpellID = 1289855' Encounters/VenomousAbyss/Nekzali.lua
          grep -q 'Bloodlust on pull.' Encounters/VenomousAbyss/Nekzali.lua
          test "$(grep -c 'warning = "Soak Raid -> Tank -> Tank"' Encounters/VenomousAbyss/Sszorak.lua)" -eq 1
          grep -q '1305902' Encounters/VenomousAbyss/Vashnik.lua
          grep -q 'iconSpellID = 1310099' Encounters/VenomousAbyss/TwinFangs.lua
          grep -q 'HasActionableDirectBossmodTimerForCall' Services/TimelineService.lua
          grep -q 'and self:IsActionable(timer)' Services/TimelineService.lua
          grep -q 'matching Blizzard-native event remains the authoritative fallback' Services/TimelineService.lua
          grep -q 'function Timeline:StartTestCall' Services/TestModeService.lua
          grep -q 'function Timeline:StopTest' Services/TestModeService.lua
          grep -q 'Stop Test' UI/RaidLeaderPolish.lua
          grep -q '\[RLA Preview\]' UI/RaidLeaderPolish.lua
          grep -q 'frame.AbilityDropdown:SetPoint("TOPLEFT", abilityRow, "TOPLEFT", 72, 5)' UI/LayoutHotfix.lua
          grep -q 'frame.AdvancedButton:SetPoint("TOPLEFT", abilityRow, "TOPLEFT", 88, -48)' UI/LayoutHotfix.lua
          grep -q 'hint:Hide()' UI/LayoutHotfix.lua
          grep -q 'systemRole = ROLE' Services/TacticsMacroService.lua
          grep -q 'name = "Pull Tactics"' Services/TacticsMacroService.lua
          grep -q 'BODY_LIMIT = 228' Services/TacticsMacroService.lua
          python3 - <<'PY'
          from pathlib import Path
          import re

          toc = Path('RaidLeadAssist.toc').read_text(encoding='utf-8').splitlines()
          missing = []
          for line in toc:
              line = line.strip()
              if not line or line.startswith('##'):
                  continue
              path = Path(line.replace('\\', '/'))
              if not path.exists():
                  missing.append(str(path))
          if missing:
              raise SystemExit('Missing TOC files: ' + ', '.join(missing))

          for path in Path('Encounters/VenomousAbyss').glob('*.lua'):
              text = path.read_text(encoding='utf-8')
              for line in text.splitlines():
                  visible = ('explanation' in line or 'action =' in line or 'warning =' in line)
                  if visible and '{{' in line:
                      raise SystemExit(f'Visible placeholder in {path}: {line.strip()}')
                  callout = ('action =' in line or 'warning =' in line or 'actionTemplate =' in line or 'warningTemplate =' in line)
                  if callout and re.search(r'"[A-Z0-9][A-Z0-9 _+→/—-]{6,}"', line):
                      raise SystemExit(f'Caps callout in {path}: {line.strip()}')
          PY
      - name: Parse Lua sources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p