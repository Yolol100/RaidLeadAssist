name: high-volume-audit

on:
  push:
    branches:
      - audit/high-volume-2026-09-16
  workflow_dispatch:

permissions:
  contents: read

# Temporary audit workflow; removed before the product PR.
jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Parse every Lua source
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done < <(find . -name '*.lua' -print0)

      - name: Execute source coverage scenarios
        run: python3 audit/high_volume_source.py

      - name: Execute controlled-runtime scenarios
        run: lua5.4 audit/high_volume_runtime.lua

      - name: Validate scenario manifests and gate findings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/source-summary.json').read_text())
          runtime = json.loads(Path('/tmp/runtime-summary.json').read_text())
          runtime_fps = [line for line in Path('/tmp/runtime-scenarios.tsv').read_text().splitlines() if line]

          assert runtime['executed'] == runtime['unique_fingerprints'] == len(runtime_fps)
          assert len(runtime_fps) == len(set(runtime_fps)), 'duplicate runtime fingerprints'
          assert source['executed'] == source['unique_fingerprints']
          total = source['executed'] + runtime['executed']
          failed = source['failed'] + runtime['failed']
          print(f'HIGH-VOLUME TOTAL: executed={total} source={source["executed"]} controlled_runtime={runtime["executed"]} failed={failed}')
          assert total > 1000, f'audit did not exceed one thousand scenarios: {total}'
          if source['failed']:
              print('SOURCE FAILURES:')
              for item in source['failures']:
                  print(item)
          if runtime['failed']:
              print('RUNTIME FAILURES:')
              for item in runtime['failures']:
                  print(item)
          assert failed == 0, f'{failed} confirmed audit scenarios failed'
          PY

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raidleadassist-high-volume-audit
          path: |
            /tmp/source-summary.json
            /tmp/source-scenarios.json
            /tmp/runtime-summary.json
            /tmp/runtime-scenarios.tsv
          if-no-files-found: error