name: Check upstream drift

on:
  schedule:
    - cron: "17 5 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/UPSTREAM_BASELINES.json"
      - "scripts/check_upstream_drift.py"
      - ".github/workflows/upstream-drift.yml"
  push:
    branches:
      - main
    paths:
      - "docs/UPSTREAM_BASELINES.json"
      - "scripts/check_upstream_drift.py"
      - ".github/workflows/upstream-drift.yml"

permissions:
  contents: read

concurrency:
  group: upstream-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare audited provider baselines
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream_drift.py --online
