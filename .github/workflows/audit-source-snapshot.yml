name: Audit source snapshot

on:
  push:

permissions:
  contents: read

jobs:
  snapshot:
    if: github.ref == 'refs/heads/audit/full-system-20260914'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Create exact tracked-source snapshot
        shell: bash
        run: git archive --format=zip --output=audit-source.zip HEAD
      - name: Upload tracked-source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: audit-source-${{ github.sha }}
          path: audit-source.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
