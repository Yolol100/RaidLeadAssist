name: Apply audit fixes

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Apply reviewed patch and remove audit transport files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git apply --check audit-core.patch
          git apply audit-core.patch
          rm audit-core.patch .github/workflows/audit-source-snapshot.yml
          git diff --check
          git config user.name "RaidLeadAssist Audit"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden Heroic Mythic audit boundaries"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:audit/full-system-20260914
