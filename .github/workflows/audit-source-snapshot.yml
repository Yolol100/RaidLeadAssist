          +
           -- The plan action is only valid before the pull; its label should say so before users click it.
           assert(contains(mainFrame, 'SetText("SEND PRE-PULL PLAN")'),
               "Boss Plan action should expose its pre-pull lifecycle in the visible label")
          diff --git a/tests/test_prepull_setup.lua b/tests/test_prepull_setup.lua
          index 2c3c2f6..c7fa3bf 100644
          --- a/tests/test_prepull_setup.lua
          +++ b/tests/test_prepull_setup.lua
          @@ -50,5 +50,6 @@ assert(Setup:IsReady("sszorak", "heroic"))
           assert(Setup:Toggle("sszorak", "heroic") == false)
           assert(not Setup:IsReady("sszorak", "heroic"))
           assert(Setup:IsReady("nekzali", "normal"), "unsupported Normal has no setup and is inert")
          +assert(Setup:SetReady("nekzali", "normal", true) == false, "retired Normal must be rejected by SetupService")
           
           print("ok - pre-pull setup exposes only current Heroic/Mythic marker contracts")
          diff --git a/tests/test_raid_group_split.lua b/tests/test_raid_group_split.lua
          index 025d123..012b197 100644
          --- a/tests/test_raid_group_split.lua
          +++ b/tests/test_raid_group_split.lua
          @@ -33,6 +33,21 @@ roster = makeRoster({ [1]=4, [3]=4, [4]=4 })
           local gapped = Split:Describe("RED", "GREEN")
           assert(not gapped:find("G2", 1, true), "empty subgroup gaps must never appear in the dynamic split")
           
          +for groupCount = 5, 8 do
