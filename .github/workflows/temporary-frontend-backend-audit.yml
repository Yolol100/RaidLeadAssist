name: temporary-frontend-backend-audit

on:
  push:
    branches:
      - fix/frontend-backend-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Syntax and UI geometry
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done < <(find . -name '*.lua' -print0)

          python3 - <<'PY'
          from pathlib import Path

          icon = Path('UI/IconPicker.lua').read_text(encoding='utf-8')
          assert 'pageSize = 70' in icon
          assert 'local columns, rows = 10, 7' in icon
          frame_height = 590
          grid_top = 178
          grid_bottom_from_bottom = 54
          grid_height = frame_height - grid_top - grid_bottom_from_bottom
          button_height = 45
          row_step = 49
          rows = 7
          used_height = button_height + (rows - 1) * row_step
          assert used_height <= grid_height, (used_height, grid_height)

          app = Path('Core/App.lua').read_text(encoding='utf-8')
          ui_init = app.index('UI:Initialize(self.db')
          guard = app.index('if Encounter:IsActive() and not Encounter:HasKnownEncounter() then', ui_init)
          timeline_init = app.index('Timeline:Initialize()', guard)
          assert ui_init < guard < timeline_init
          assert 'Overlay:HideAll()' in app[guard:timeline_init]
          print(f'UI GEOMETRY PASS: icon rows use {used_height}px of {grid_height}px')
          print('FAIL-CLOSED STATIC PASS: unknown-encounter guard runs after UI population')
          PY
      - name: App fail-closed runtime scenario
        shell: bash
        run: |
          cat > /tmp/app_guard_test.lua <<'LUA'
          local ns = { modules = {}, version = 'test' }
          function ns:RegisterModule(name, module) self.modules[name] = module end
          function ns:GetModule(name) assert(self.modules[name], 'missing '..name); return self.modules[name] end
          function ns:Print() end

          local timeline = { lastEncounter = 'unset', setCalls = {} }
          function timeline:SetEncounter(key, preserve)
              self.lastEncounter = key
              self.setCalls[#self.setCalls + 1] = {key=key, preserve=preserve}
          end
          function timeline:Initialize() self.initialized = true end
          function timeline:RefreshProviders() end
          function timeline:GetProviderDiagnostics() return '' end
          function timeline:Reset() self.lastEncounter = nil end

          local overlay = { hideCount = 0 }
          function overlay:HideAll() self.hideCount = self.hideCount + 1 end
          function overlay:Initialize() self.initialized = true end
          function overlay:RefreshBindings() end
          function overlay:NotifyMacroAcknowledged() end

          local db = { selectedBossId='encounter:test', selectedBossKey='test', selectedDifficultyKey='heroic' }
          local Database = {}
          function Database:Initialize() end
          function Database:Get() return db end
          function Database:HasNewerSchema() return false end
          function Database:ResetPosition() end

          local EventBus = {}
          function EventBus:On() end

          local Registry = {}
          function Registry:SetActiveDifficulty() end
          function Registry:Get() return { encounterID=123 } end
          function Registry:FindByEncounterID() return nil end

          local Encounter = {}
          function Encounter:Initialize() end
          function Encounter:IsActive() return true end
          function Encounter:HasKnownEncounter() return false end

          local boss = { id='encounter:test', sourceEncounterKey='test', name='Test Boss' }
          local BossMacros = {}
          function BossMacros:Initialize() end
          function BossMacros:GetBoss(id) if id == boss.id then return boss end end
          function BossMacros:GetMacros() return {} end
          function BossMacros:AcknowledgeMacro() return false end
          function BossMacros:FindByEncounterID() return nil end

          local ManagedMacros = {}
          function ManagedMacros:Initialize() end
          function ManagedMacros:GetManagedOverhead() return 13 end
          function ManagedMacros:GetMacroBodyMax() return 255 end
          function ManagedMacros:GetMacroIndex() return nil end
          function ManagedMacros:SyncMacro() end
          function ManagedMacros:Pickup() end
          function ManagedMacros:DeleteManaged() end

          local UI = { frame = nil }
          function UI:Initialize(_, callbacks)
              self.frame = {}
              callbacks.onBossSelected(boss, false)
          end
          function UI:Toggle() end
          function UI:Show() end
          function UI:Hide() end
          function UI:SelectBoss() end

          ns:RegisterModule('Core.Constants', {DIFFICULTIES={heroic=true,mythic=true}, DIFFICULTY_KEY_BY_ID={}})
          ns:RegisterModule('Core.Database', Database)
          ns:RegisterModule('Core.EventBus', EventBus)
          ns:RegisterModule('Encounters.Registry', Registry)
          ns:RegisterModule('Services.TimelineService', timeline)
          ns:RegisterModule('Services.EncounterService', Encounter)
          ns:RegisterModule('Services.BossMacroService', BossMacros)
          ns:RegisterModule('Services.ManagedMacroService', ManagedMacros)
          ns:RegisterModule('Services.ActionBarOverlayService', overlay)
          ns:RegisterModule('UI.BossMacroManager', UI)

          _G.SlashCmdList = {}
          _G.C_Timer = { After = function(_, callback) callback() end }
          _G.CreateFrame = function()
              return {
                  RegisterEvent=function() end,
                  UnregisterEvent=function() end,
                  SetScript=function() end,
              }
          end

          local chunk = assert(loadfile('Core/App.lua'))
          chunk('RaidLeadAssist', ns)
          local App = ns:GetModule('Core.App')
          App:Initialize()

          assert(timeline.lastEncounter == nil, 'UI initialization re-enabled stale encounter timing')
          assert(overlay.hideCount >= 1, 'overlay was not hidden for unknown active encounter')
          assert(timeline.initialized == true and overlay.initialized == true, 'services did not continue initializing')
          print('APP RUNTIME PASS: unknown active encounter remains fail-closed after UI init')
          LUA
          lua5.4 /tmp/app_guard_test.lua
