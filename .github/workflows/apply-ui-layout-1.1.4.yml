name: Apply UI layout 1.1.4

on:
  push:
    branches:
      - fix/ui-layout-polish-1.1.4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ui-layout-polish-1.1.4
          fetch-depth: 0
      - name: Apply UI layout polish
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_ui_layout_114.py
          git diff --check
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find . -type f -name '*.lua' -print0 | xargs -0 -n1 luac -p
          if git diff --quiet; then
            echo 'No patch changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add UI/BossMacroManager.lua UI/IconPicker.lua RaidLeadAssist.toc
          git commit -m 'Polish Blizzard UI layout and macro labels'
          git push origin HEAD:fix/ui-layout-polish-1.1.4
