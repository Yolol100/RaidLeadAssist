name: Update final audit test pin

on:
  push:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Align reviewed BigWigs core regression pin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          old='4c9aea8bebb365878ac298d166dadf21e4e807ce'
          new='511af2ec3a91608cfa9e476e2d4fe1b1cbbe10ca'
          if ! grep -q "$old" tests/test_addon_audit_hardening.lua; then
            echo "Regression pin already current."
            exit 0
          fi
          sed -i "s/$old/$new/g" tests/test_addon_audit_hardening.lua
          git diff --check
          git config user.name "RaidLeadAssist Final Audit"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_addon_audit_hardening.lua
          git commit -m "test: align BigWigs core baseline pin"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:audit/final-plafond-20260914
