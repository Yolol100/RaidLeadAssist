name: Strategy / mechanic correction
description: Propose a source-backed correction to boss plan, call or assignment guidance.
title: "[Strategy] "
labels: []
body:
  - type: input
    id: encounter
    attributes:
      label: Encounter and difficulty
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current RLA behavior or text
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Link authoritative/current public sources or describe reproducible live Retail evidence. Distinguish strategy preference from mechanic invariant.
    validations:
      required: true
  - type: checkboxes
    id: volatility
    attributes:
      label: Tuning / volatility check
      options:
        - label: I have avoided presenting a volatile tuning number as a permanent mechanic unless current authoritative evidence requires it.
          required: true
